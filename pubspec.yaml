name: weather_app
description: "A weather_app project."
version: 1.1.0
environment:
  sdk: ^3.5.4
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.4.0
  flutter_dotenv: ^5.2.1
  shimmer: ^3.0.0
  lottie: ^3.2.0
  geolocator: ^14.0.2
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/
    - assets/lotties/
    - .env
  fonts:
    - family: Borel
      fonts: 
      - asset: assets/fonts/Borel-Regular.ttf
